# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# NOTE: org.gradle.java.home does NOT belong here. This file is committed, so an
# absolute path to a local JDK is invalid on every other machine - it broke every
# CI run until it was moved to ~/.gradle/gradle.properties, which is machine-local.

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17.17

# Mod Properties
mod_version=1.0.2
maven_group=net.scarabx.twoheavens

# Dependencies
fabric_api_version=0.155.2+26.1.2
trinkets_version=4.0.0-beta.3+26.1
geckolib_version=5.5.2
player_anim_version=SdKAeB6x
